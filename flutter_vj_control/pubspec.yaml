name: flutter_vj_control
description: VIB34D VJ Control Suite - Professional Flutter-based VJ interface for holographic visualizers
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # WebView Integration
  webview_flutter: ^4.4.2
  flutter_inappwebview: ^6.0.0

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio
  flutter_sound: ^9.2.13
  audio_session: ^0.1.18

  # MIDI & OSC
  flutter_midi_command: ^0.4.15
  osc: ^2.3.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/presets/
